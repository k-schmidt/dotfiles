# Volta-managed Node tooling.
#
# `common` installs on every machine. `darwin` adds the AI CLIs: on the Linux
# devserver those are installed and updated centrally at /usr/local/bin, and a
# Volta copy would shadow the managed one with a stale version.
[packages.volta]
  common = [
    "node",
    "typescript",
    "neovim",
    "prettier"
  ]
  darwin = [
    "@anthropic-ai/claude-code",
    "@openai/codex"
  ]

# dnf packages for the Linux devserver. macOS covers the same ground through
# dot_config/brew/Brewfile.
#
# Confirmed installable on the devserver. Absent on purpose:
#   neovim  distro build predates what this config needs (0.10+)
#   volta   not packaged
#   direnv  not in base or EPEL; `dnf install` fails
# All three are fetched from upstream releases into ~/.local by
# run_onchange_install-linux-packages.sh instead.
#
# Still unhandled, also missing from the repos: lazygit, difftastic, stylua,
# shfmt, uv. Add them the same way if you end up wanting them here.
[packages.dnf]
  linux = [
    "zsh",
    "git",
    "tmux",
    "ripgrep",
    "fd-find",
    "fzf",
    "jq",
    "zoxide"
  ]
