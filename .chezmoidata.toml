# Volta-managed Node tooling.
#
# `common` installs on every machine. `darwin` adds the AI CLIs: on the Linux
# devserver those are installed and updated centrally at /usr/local/bin, and a
# Volta copy would shadow the managed one with a stale version.
[packages.volta]
  common = [
    "node",
    "typescript",
    "neovim",
    "prettier"
  ]
  darwin = [
    "@anthropic-ai/claude-code",
    "@openai/codex"
  ]

# dnf packages for the Linux devserver. macOS covers the same ground through
# dot_config/brew/Brewfile.
#
# Confirmed installable on the devserver. jq and unzip are here to support
# run_onchange_install-linux-packages.sh itself: jq reads release tags off the
# GitHub API, unzip unpacks stylua.
#
# Absent on purpose, because the repos do not carry them. That script fetches
# each from its upstream release into ~/.local instead:
#   neovim   distro build predates what this config needs (0.10+)
#   volta    upstream installer
#   direnv, lazygit, difftastic (difft), stylua, shfmt, uv
[packages.dnf]
  linux = [
    "zsh",
    "git",
    "tmux",
    "ripgrep",
    "fd-find",
    "fzf",
    "jq",
    "unzip",
    "zoxide"
  ]
