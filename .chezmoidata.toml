# Volta-managed Node tooling.
#
# Homebrew owns everything it packages (see dot_config/brew/Brewfile); Volta
# owns only tools that ship exclusively through npm. Agent CLIs live in the
# Brewfile so the Homebrew-first PATH resolves one managed copy.
[packages.volta]
  common = [
    "node",
    "typescript",
    "neovim",
    "prettier"
  ]
