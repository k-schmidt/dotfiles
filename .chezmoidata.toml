# Volta-managed Node tooling. Identical on every machine.
#
# claude-code and codex are deliberately absent. Both the devserver and the
# work laptop carry a centrally managed copy at /usr/local/bin, and zshrc
# aliases to it whenever it exists — so a Volta install would be downloaded and
# kept up to date only to be shadowed by the alias on every invocation.
[packages.volta]
  common = [
    "node",
    "typescript",
    "neovim",
    "prettier"
  ]

# dnf packages for the Linux devserver. macOS covers the same ground through
# dot_config/brew/Brewfile.
#
# Confirmed installable on the devserver. jq and unzip are here to support
# run_onchange_install-linux-packages.sh itself: jq reads release tags off the
# GitHub API, unzip unpacks stylua. gcc is for `tree-sitter build`, which
# compiles a parser.so per language and would otherwise fail on a box that
# never had a C toolchain installed.
#
# Absent on purpose, because the repos do not carry them at a usable version.
# That script fetches each from its upstream release into ~/.local instead:
#   neovim       distro build predates what this config needs (0.10+)
#   tree-sitter  nvim-treesitter (main) requires the CLI at >= 0.26.1
#   volta        upstream installer
#   direnv, lazygit, difftastic (difft), stylua, shfmt, uv
[packages.dnf]
  linux = [
    "zsh",
    "git",
    "tmux",
    "ripgrep",
    "fd-find",
    "fzf",
    "jq",
    "unzip",
    "zoxide",
    "gcc"
  ]
