repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-xml
      - id: check-yaml
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: validate-shell
        name: validate rendered shell sources
        entry: scripts/validate-shell.sh
        language: system
        files: '(^|/)([^/]+\.sh(\.tmpl)?|dot_(bash_profile|bashrc|zshrc|p10k\.zsh))$'
      - id: stylua
        name: check Neovim Lua formatting
        entry: stylua --check --config-path dot_config/nvim/dot_stylua.toml dot_config/nvim
        language: system
        files: '^dot_config/nvim/(.*\.lua|dot_stylua\.toml)$'
        pass_filenames: false
      - id: brewfile-syntax
        name: check Brewfile syntax
        entry: ruby -c
        language: system
        files: '^dot_config/brew/Brewfile$'
      - id: plist-syntax
        name: check property list syntax
        entry: plutil -lint
        language: system
        files: '\.plist$'
      - id: chezmoi-dry-run
        name: check chezmoi dry run
        entry: chezmoi apply --dry-run
        language: system
        pass_filenames: false
        always_run: true
