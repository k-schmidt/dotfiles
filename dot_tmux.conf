# =============================================================================
# tmux.conf — Optimized Configuration
# =============================================================================

# --- Core Settings -----------------------------------------------------------

# Remap prefix to Ctrl-Space (frees Ctrl-A for beginning-of-line in shell)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# True color and terminal support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable xterm-style key sequences (fixes Home/End/Ctrl+arrows in apps)
set-window-option -g xterm-keys on

# Fix Home and End keys
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"

# Enable mouse mode
set -g mouse on

# Increase scrollback buffer
set -g history-limit 100000

# Eliminate escape delay (critical for vim/neovim users)
set -sg escape-time 0

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed (no gaps)
set -g renumber-windows on

# Enable focus events (useful for vim autoread, etc.)
set -g focus-events on

# Display messages for longer
set -g display-time 3000
set -g display-panes-time 3000

# Longer tmux status messages
set -g status-interval 2

# --- Window & Pane Management ------------------------------------------------

# Split panes with | and - (stay in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New windows open in current path
bind c new-window -c "#{pane_current_path}"

# Quick 3-pane layout: large left pane (60%), two stacked right panes
bind-key 3 split-window -h -p 40 \;\
  split-window -v \;\
  select-pane -t 1

# Quick 4-pane layout: 2x2 grid
bind-key 4 split-window -h -p 40 -c "#{pane_current_path}" \;\
  split-window -v -c "#{pane_current_path}" \;\
  select-pane -t 1 \;\
  split-window -v -c "#{pane_current_path}" \;\
  select-pane -t 1

# Vim-style pane navigation (prefix-based; still works if the plugin below is
# not installed, e.g. on a machine without the Neovim config)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Seamless nvim <-> tmux navigation, no prefix. Forwards the key to Neovim when
# the active pane is running it, otherwise switches panes, so one motion crosses
# both boundaries. Pairs with christoomey/vim-tmux-navigator.
# fzf is in the pattern too, so C-j/C-k keep moving through its result list.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# C-l is claimed above, so the shell can no longer use it to clear. Put clear
# back behind the prefix.
bind C-l send-keys 'C-l'

# Same motions inside copy mode.
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Resize panes with Shift+arrow (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Swap windows left/right with Ctrl+Shift+arrow
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# --- Copy Mode (vi-style) ---------------------------------------------------

setw -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection

# Platform-aware clipboard: pbcopy on macOS, xclip on Linux
if-shell 'command -v pbcopy >/dev/null' \
  'bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"; bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"; bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"'

# Enter copy mode with prefix + [
bind [ copy-mode

# --- Quality of Life ---------------------------------------------------------

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Kill pane without confirmation
bind x kill-pane

# Toggle synchronize-panes (type in all panes at once)
bind S setw synchronize-panes \; display "Sync #{?pane_synchronized,ON,OFF}"

# --- Status Bar --------------------------------------------------------------

set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left-length 50
set -g status-left "#[fg=#a6e3a1,bold] #S #[fg=#89b4fa]#I:#P "

set -g status-right-length 80
# Colour the text, not the background. #{cpu_bg_color} paints a green/yellow/red
# block behind the status fg (#cdd6f4), which is a 1.03-1.60:1 contrast ratio —
# unreadable. As a foreground on the dark bar the same colours run 7-13:1.
# Using the per-metric fg vars also means RAM reports its own load rather than
# sitting inside a block tinted by the CPU reading.
set -g status-right '#{cpu_fg_color}CPU #{cpu_percentage}#[default]  GPU #{gpu}  #{ram_fg_color}RAM #{ram_percentage}#[default]  #[fg=#a6adc8]%a %b %d %H:%M '

# Active window styling
setw -g window-status-current-format "#[fg=#a6e3a1,bold] #I:#W#{?window_zoomed_flag, 🔍,} "
# overlay2, not overlay0: the latter is 3.36:1 on this background, below the
# 4.5:1 readability floor. Still clearly dimmer than the active window.
setw -g window-status-format "#[fg=#9399b2] #I:#W "

# Pane border colors
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"

# --- Plugins -----------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# System monitoring
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'dnlbauer/tmux-plugin-simple-gpu'

# Initialize TPM (must be last line)
run '~/.tmux/plugins/tpm/tpm'
